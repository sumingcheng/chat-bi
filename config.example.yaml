debug: false

database:
  host: localhost
  port: 3306
  user: root
  password: admin123456
  name: chat_bi
  sys_name: chat_bi_system

milvus:
  host: localhost
  port: 19530

llm:
  # 默认启动选择；前端/接口可在运行时切换 provider + model
  provider: openai
  model: gpt-5-chat-latest
  api_key: your_api_key_here
  base_url: ""
  providers:
    openai:
      api_key: your_openai_key_here
      model: gpt-5-chat-latest
      base_url: https://api.openai.com/v1
    deepseek:
      api_key: ""
      model: deepseek-reasoner
      base_url: https://api.deepseek.com

embedding:
  # openai / ollama
  provider: openai
  model: text-embedding-3-small
  dim: 1536
  # 留空则复用 llm.api_key
  api_key: ""
  # 仅 ollama 需要
  api_url: ""

